name = "varuna"
version = "0.1.0"
keywords = ["cryptography", "snark", "formal-verification", "varuna"]
defaultTargets = ["Varuna"]

# `lint.sh --lake-lint` requires a configured driver. Iteration 0 has no
# extra package lints; the driver is a no-op so the hook can run `--all`.
lintDriver = "lint"

[leanOptions]
pp.unicode.fun = true
autoImplicit = false

# Iteration 0 is self-contained Lean 4: the R1CS relation does not yet need
# Mathlib. Iteration 1 (evaluation domains, vanishing polynomials, AHP)
# switches the carrier to Mathlib `ZMod p` / `Polynomial`. See PLAN.md.

[[lean_lib]]
name = "Varuna"

[[lean_exe]]
name = "lint"
srcDir = "scripts"
root = "Lint"
