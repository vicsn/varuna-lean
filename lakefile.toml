name = "varuna"
version = "0.1.0"
keywords = ["cryptography", "snark", "formal-verification", "varuna"]
defaultTargets = ["Varuna"]

# `lint.sh --lake-lint` requires a configured driver. No extra package
# lints yet; the driver is a no-op so the hook can run `--all`.
lintDriver = "lint"

[leanOptions]
pp.unicode.fun = true
autoImplicit = false

# Mathlib pin matches tag `v4.33.0` (Lean 4.33): `ZMod p` and `Polynomial`.
# See book/src/formal-verification/security-analysis.md.

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.33.0"

[[lean_lib]]
name = "Varuna"

[[lean_exe]]
name = "lint"
srcDir = "scripts"
root = "Lint"
