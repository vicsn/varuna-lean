name = "varuna"
version = "0.1.0"
keywords = ["cryptography", "snark", "formal-verification", "varuna"]
defaultTargets = ["Varuna"]

# `lint.sh --lake-lint` requires a configured driver. No extra package
# lints yet; the driver is a no-op so the hook can run `--all`.
lintDriver = "lint"

[leanOptions]
pp.unicode.fun = true
autoImplicit = false

# Iteration 1 switches the AHP carrier to Mathlib `ZMod p` / `Polynomial`.
# Pin matches Mathlib's `v4.33.0` tag (Lean 4.33). See PLAN.md.

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.33.0"

[[lean_lib]]
name = "Varuna"

[[lean_exe]]
name = "lint"
srcDir = "scripts"
root = "Lint"
